name: build-angle-android-x64
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: cache checkout
        uses: actions/cache@v4
        with:
          path: |
            ~/angle
            ~/.cipd
            ~/depot_tools
          key: angle-src-v2

      - name: depot_tools
        run: |
          if [ ! -d $HOME/depot_tools ]; then git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools; fi
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: fetch ANGLE
        run: |
          mkdir -p $HOME/angle && cd $HOME/angle
          if [ ! -f .gclient ]; then gclient config --name src --custom-var=checkout_android=True https://chromium.googlesource.com/angle/angle; fi
          gclient sync

      - name: patch swiftshader headers
        run: |
          H=$(find $HOME/angle/src/third_party -name 'vk_android_native_buffer.h' 2>/dev/null | head -1)
          echo "found header: $H"
          if [ -n "$H" ]; then
            mkdir -p $HOME/angle/src/third_party/SwiftShader/include/vulkan
            cp -v "$H" $HOME/angle/src/third_party/SwiftShader/include/vulkan/
          else
            mkdir -p $HOME/angle/src/third_party/SwiftShader/include/vulkan
            curl -sSL -o $HOME/angle/src/third_party/SwiftShader/include/vulkan/vk_android_native_buffer.h \
              https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/main/include/vulkan/vk_android_native_buffer.h
            echo "fetched from Khronos"
          fi
          ls -l $HOME/angle/src/third_party/SwiftShader/include/vulkan/

      - name: NDK
        run: |
          if [ ! -d $HOME/android-ndk-r27c ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
          fi
          ls -d $HOME/android-ndk-r27c

      - name: gn gen
        run: |
          cd $HOME/angle/src
          gn gen $HOME/out/Rel --args="target_os=\"android\" target_cpu=\"x64\" is_debug=false is_component_build=false angle_enable_vulkan=true angle_enable_swiftshader=true android_ndk_path=\"$HOME/android-ndk-r27c\""

      - name: autoninja angle
        run: |
          cd $HOME/angle/src
          autoninja -C $HOME/out/Rel libEGL_angle.so libGLESv2_angle.so libGLESv1_CM_angle.so 2>&1 | tee $HOME/ninja-angle.log
          exit ${PIPESTATUS[0]}

      - name: autoninja swiftshader
        run: |
          cd $HOME/angle/src
          autoninja -C $HOME/out/Rel libvk_swiftshader.so 2>&1 | tee $HOME/ninja-swift.log
          exit ${PIPESTATUS[0]}

      - name: collect
        run: |
          mkdir -p artifact
          find $HOME/out/Rel -name 'libEGL_angle.so' -o -name 'libGLESv2_angle.so' -o -name 'libGLESv1_CM_angle.so' -o -name 'libvk_swiftshader.so' | xargs -r -I{} cp -v {} artifact/
          find $HOME/out/Rel -name '*.so' > artifact/so-listing.txt
          ls -l artifact

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-x64
          path: artifact/*

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: artifact/*

      - name: save logs on failure
        if: failure()
        run: |
          mkdir -p logs
          cp $HOME/ninja-angle.log ./logs/ 2>/dev/null || true
          cp $HOME/ninja-swift.log ./logs/ 2>/dev/null || true

      - name: release logs
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          files: logs/*