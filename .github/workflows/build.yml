name: build-angle-android-x64
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: cache checkout
        uses: actions/cache@v4
        with:
          path: |
            ~/angle
            ~/.cipd
            ~/depot_tools
          key: angle-src-v2

      - name: depot_tools
        run: |
          if [ ! -d $HOME/depot_tools ]; then git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools; fi
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: fetch ANGLE
        run: |
          mkdir -p $HOME/angle && cd $HOME/angle
          if [ ! -f .gclient ]; then gclient config --name src --custom-var=checkout_android=True https://chromium.googlesource.com/angle/angle; fi
          gclient sync
          ls $HOME/angle/src/third_party/SwiftShader | head

      - name: NDK
        run: |
          if [ ! -d $HOME/android-ndk-r27c ]; then
            curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
          fi
          ls -d $HOME/android-ndk-r27c

      - name: gn gen
        run: |
          cd $HOME/angle/src
          gn gen $HOME/out/Rel --args="target_os=\"android\" target_cpu=\"x64\" is_debug=false is_component_build=false angle_enable_vulkan=true angle_enable_swiftshader=true android_ndk_path=\"$HOME/android-ndk-r27c\""

      - name: autoninja angle
        run: |
          cd $HOME/angle/src
          autoninja -C $HOME/out/Rel libEGL_angle libGLESv2_angle libGLESv1_CM_angle

      - name: autoninja swiftshader
        run: |
          cd $HOME/angle/src
          autoninja -C $HOME/out/Rel -t targets all | grep -i -E 'swift' | head -20

      - name: build swiftshader
        run: |
          cd $HOME/angle/src
          T=$(autoninja -C $HOME/out/Rel -t targets all | grep -oE '^[^:]*libvk_swiftshader[^:]*:' | tr -d ':' | head -1)
          if [ -z "$T" ]; then T=$(autoninja -C $HOME/out/Rel -t targets all | grep -i swiftshader | grep -iE 'vk|vulkan' | head -1 | cut -d: -f1); fi
          echo "swift target = $T"
          if [ -n "$T" ]; then autoninja -C $HOME/out/Rel "$T"; fi
          find $HOME/out/Rel -name '*swiftshader*' | head -20

      - name: collect
        run: |
          mkdir -p artifact
          find $HOME/out/Rel -name 'libEGL_angle.so' -o -name 'libGLESv2_angle.so' -o -name 'libGLESv1_CM_angle.so' -o -name 'libvk_swiftshader.so' | xargs -r -I{} cp -v {} artifact/
          ls -l artifact

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-x64
          path: artifact/*

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: artifact/*